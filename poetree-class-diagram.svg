<svg viewBox="0 0 860 600" width="860" height="600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Poetree.get_corpora() returns Corpus; Corpus.get_authors() returns Author; Corpus.get_sources() and Author.get_sources() return Source; Author.get_poems() and Source.get_poems() return Poem.">
  <style>
    .bg { fill: #ffffff; }
    .cd-edge { fill: none; stroke: #6b7280; stroke-width: 2; }
    .cd-arrowhead { fill: #6b7280; }
    .cd-label { font: italic 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #4b5563; }
    .cd-node rect { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2; }
    .cd-node text { font: 600 18px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; text-anchor: middle; dominant-baseline: middle; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .cd-edge { stroke: #9ca3af; }
      .cd-arrowhead { fill: #9ca3af; }
      .cd-label { fill: #9ca3af; }
      .cd-node rect { fill: #1e1b4b; stroke: #818cf8; }
      .cd-node text { fill: #e5e7eb; }
    }
  </style>
  <defs>
    <marker id="cdArrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="cd-arrowhead" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="860" height="600" rx="12"/>

  <path class="cd-edge" marker-end="url(#cdArrow)" d="M430,86 L430,160"/>
  <path class="cd-edge" marker-end="url(#cdArrow)" d="M430,216 L430,270 L130,270 L130,350"/>
  <path class="cd-edge" marker-end="url(#cdArrow)" d="M430,216 L430,270 L730,270 L730,350"/>
  <path class="cd-edge" marker-end="url(#cdArrow)" d="M220,378 L640,378"/>
  <path class="cd-edge" d="M130,406 L130,460 L430,460"/>
  <path class="cd-edge" d="M730,406 L730,460 L430,460"/>
  <path class="cd-edge" marker-end="url(#cdArrow)" d="M430,460 L430,490"/>

  <text class="cd-label" x="450" y="127">get_corpora()</text>
  <text class="cd-label" x="280" y="258" text-anchor="middle">get_authors()</text>
  <text class="cd-label" x="580" y="258" text-anchor="middle">get_sources()</text>
  <text class="cd-label" x="430" y="365" text-anchor="middle">get_sources()</text>
  <text class="cd-label" x="115" y="440" text-anchor="end">get_poems()</text>
  <text class="cd-label" x="745" y="440" text-anchor="start">get_poems()</text>

  <g class="cd-node">
    <rect x="345" y="30" width="170" height="56" rx="10"/>
    <text x="430" y="58">Poetree</text>
  </g>
  <g class="cd-node">
    <rect x="345" y="160" width="170" height="56" rx="10"/>
    <text x="430" y="188">Corpus</text>
  </g>
  <g class="cd-node">
    <rect x="40" y="350" width="180" height="56" rx="10"/>
    <text x="130" y="378">Author</text>
  </g>
  <g class="cd-node">
    <rect x="640" y="350" width="180" height="56" rx="10"/>
    <text x="730" y="378">Source</text>
  </g>
  <g class="cd-node">
    <rect x="345" y="490" width="170" height="56" rx="10"/>
    <text x="430" y="518">Poem</text>
  </g>
</svg>
